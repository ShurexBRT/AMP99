name: Apply AMP99 alpha.2 version bump

on:
  push:
    branches:
      - agent/chatgpt/alpha2-release
    paths:
      - .github/workflows/apply-alpha2-version-bump.yml

permissions:
  contents: write

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/chatgpt/alpha2-release
      - name: Update application and Windows package versions
        shell: pwsh
        run: |
          $files = @(
            'package.json',
            'src-tauri/Cargo.toml',
            'src-tauri/tauri.conf.json',
            'scripts/build-store-msix.ps1',
            '.github/workflows/store-msix-preflight.yml',
            'src/preferences/nativePreferences.ts',
            'README.md'
          )
          foreach ($path in $files) {
            $text = Get-Content $path -Raw
            $text = $text.Replace('0.2.0-alpha.1', '0.2.0-alpha.2')
            $text = $text.Replace('0.2.0.1', '0.2.0.2')
            Set-Content $path $text -NoNewline
          }
          Remove-Item '.github/workflows/apply-alpha2-version-bump.yml'
      - name: Verify version consistency
        shell: pwsh
        run: npm run version:check
      - name: Commit release version
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json src-tauri/Cargo.toml src-tauri/tauri.conf.json scripts/build-store-msix.ps1 .github/workflows/store-msix-preflight.yml src/preferences/nativePreferences.ts README.md .github/workflows/apply-alpha2-version-bump.yml
          git commit -m "release: bump AMP99 to 0.2.0-alpha.2"
          git push origin HEAD:agent/chatgpt/alpha2-release

name: Apply Preferences integration patch

on:
  push:
    branches:
      - agent/chatgpt/preferences

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/chatgpt/preferences
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply precise integration patch
        run: node scripts/apply-preferences-patch.mjs

      - name: Commit patched sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/App.tsx src/components/PlaylistEditor.tsx src/windowing/nativeWindowHost.ts
          git diff --cached --quiet && exit 0
          git commit -m "feat: integrate native Preferences window"
          git push origin HEAD:agent/chatgpt/preferences

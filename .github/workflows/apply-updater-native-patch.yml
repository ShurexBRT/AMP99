name: Apply updater native patch

on:
  push:
    branches:
      - agent/chatgpt/updater-release
    paths:
      - .github/workflows/apply-updater-native-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/chatgpt/updater-release
      - name: Wire guarded release opener into Tauri command handler
        shell: pwsh
        run: |
          $path = 'src-tauri/src/lib.rs'
          $text = Get-Content $path -Raw
          if ($text -notmatch 'mod update_links;') {
            $text = "mod update_links;`n`n" + $text
          }
          if ($text -notmatch 'use update_links::open_official_amp99_release;') {
            $needle = 'use tauri_plugin_global_shortcut::{GlobalShortcutExt, ShortcutState};'
            $text = $text.Replace($needle, "$needle`nuse update_links::open_official_amp99_release;")
          }
          if ($text -notmatch 'open_official_amp99_release,') {
            $needle = '            set_group_always_on_top_preference,'
            $text = $text.Replace($needle, "$needle`n            open_official_amp99_release,")
          }
          Set-Content $path $text -NoNewline
          Remove-Item '.github/workflows/apply-updater-native-patch.yml'
      - name: Commit native updater wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src-tauri/src/lib.rs .github/workflows/apply-updater-native-patch.yml
          git commit -m "feat: wire guarded release opener command"
          git push origin HEAD:agent/chatgpt/updater-release

name: Bootstrap AMP99 alpha.2 release

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap-alpha2-release.yml

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  publish:
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Checkout alpha.2 source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install dependencies
        run: npm install

      - name: Verify exact alpha.2 release version
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($version -ne '0.2.0-alpha.2') {
            throw "Bootstrap workflow only publishes 0.2.0-alpha.2. Found: $version"
          }
          npm run version:check

      - name: Generate icons
        run: npm run tauri:icon

      - name: Build frontend
        run: npm run build

      - name: Run Rust unit tests
        working-directory: src-tauri
        run: cargo test

      - name: Build Windows installers
        shell: pwsh
        run: |
          & npm.cmd run tauri -- build --bundles msi,nsis
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Smoke-test release executable
        shell: pwsh
        run: |
          $exe = Resolve-Path 'src-tauri/target/release/amp99.exe'
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          $process.Refresh()
          if ($process.HasExited) {
            throw "AMP99 alpha.2 executable exited during startup smoke with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id -Force

      - name: Create checksums
        shell: pwsh
        run: |
          $msi = Get-ChildItem 'src-tauri/target/release/bundle/msi/*.msi' | Select-Object -First 1
          $setup = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*-setup.exe' | Select-Object -First 1
          if (-not $msi -or -not $setup) { throw 'AMP99 alpha.2 installers were not produced.' }
          @(
            "$(Get-FileHash $msi.FullName -Algorithm SHA256 | Select-Object -ExpandProperty Hash)  $($msi.Name)",
            "$(Get-FileHash $setup.FullName -Algorithm SHA256 | Select-Object -ExpandProperty Hash)  $($setup.Name)"
          ) | Set-Content SHA256SUMS.txt

      - name: Publish tag and GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v0.2.0-alpha.2'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "$tag already exists; nothing to publish."
            exit 0
          }
          $msi = Get-ChildItem 'src-tauri/target/release/bundle/msi/*.msi' | Select-Object -First 1
          $setup = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*-setup.exe' | Select-Object -First 1
          gh release create $tag `
            --repo $env:GITHUB_REPOSITORY `
            --target $env:GITHUB_SHA `
            --title 'AMP99 0.2.0-alpha.2' `
            --prerelease `
            --generate-notes `
            $msi.FullName `
            $setup.FullName `
            'SHA256SUMS.txt'

      - name: Remove one-time bootstrap workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/bootstrap-alpha2-release.yml
          git commit -m "chore: remove alpha.2 bootstrap release workflow"
          git push origin HEAD:main

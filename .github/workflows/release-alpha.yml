name: Publish Windows alpha release

on:
  push:
    tags:
      - 'v*-alpha.*'

permissions:
  contents: write

jobs:
  windows-alpha-release:
    runs-on: windows-2025
    steps:
      - name: Checkout tagged source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Verify tag matches AMP99 application version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if (-not $tag.StartsWith('v')) {
            throw "AMP99 release tag must start with v. Got: $tag"
          }
          $tagVersion = $tag.Substring(1)
          $packageVersion = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauriVersion = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          if ($tagVersion -ne $packageVersion) {
            throw "Tag version $tagVersion does not match package.json $packageVersion"
          }
          if ($tagVersion -ne $tauriVersion) {
            throw "Tag version $tagVersion does not match tauri.conf.json $tauriVersion"
          }
          if ($tagVersion -notmatch '-alpha\.') {
            throw "This workflow only publishes alpha tags. Got: $tagVersion"
          }
          npm run version:check
          npm run release:notes:check -- $tagVersion

      - name: Generate AMP99 platform icons
        run: npm run tauri:icon

      - name: Run frontend production build
        run: npm run build

      - name: Run Rust unit tests
        working-directory: src-tauri
        run: cargo test

      - name: Verify updater signing configuration
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          $config = Get-Content 'src-tauri/tauri.conf.json' -Raw | ConvertFrom-Json
          if ([string]::IsNullOrWhiteSpace($env:TAURI_SIGNING_PRIVATE_KEY)) {
            throw 'TAURI_SIGNING_PRIVATE_KEY GitHub Secret is missing.'
          }
          if ($config.plugins.updater.pubkey -eq '__AMP99_UPDATER_PUBLIC_KEY__') {
            throw 'Replace __AMP99_UPDATER_PUBLIC_KEY__ in src-tauri/tauri.conf.json before publishing.'
          }

      - name: Build MSI and NSIS installers
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          & npm.cmd run tauri -- build --bundles msi,nsis
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Create signed updater manifest
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $setup = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*-setup.exe' | Select-Object -First 1
          if (-not $setup) { throw 'AMP99 signed NSIS updater artifact was not produced.' }
          $signaturePath = "$($setup.FullName).sig"
          if (-not (Test-Path $signaturePath)) { throw "Missing updater signature: $signaturePath" }
          $signature = (Get-Content $signaturePath -Raw).Trim()
          $downloadUrl = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:GITHUB_REF_NAME/$($setup.Name)"
          $manifest = @{
            version = $version
            notes = "AMP99 $version"
            pub_date = (Get-Date).ToUniversalTime().ToString('o')
            platforms = @{
              'windows-x86_64' = @{
                signature = $signature
                url = $downloadUrl
              }
            }
          } | ConvertTo-Json -Depth 5
          $manifest | Set-Content -Path latest.json -Encoding utf8NoBOM

      - name: Smoke-test release executable
        shell: pwsh
        run: |
          $exe = Resolve-Path 'src-tauri/target/release/amp99.exe'
          $process = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 8
          $process.Refresh()
          if ($process.HasExited) {
            throw "AMP99 release executable exited during startup smoke test with code $($process.ExitCode)."
          }
          Stop-Process -Id $process.Id -Force

      - name: Create SHA256 checksums
        shell: pwsh
        run: |
          $msi = Get-ChildItem 'src-tauri/target/release/bundle/msi/*.msi' | Select-Object -First 1
          $setup = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*-setup.exe' | Select-Object -First 1
          if (-not $msi -or -not $setup) { throw 'AMP99 release installers were not produced.' }
          @(
            "$(Get-FileHash $msi.FullName -Algorithm SHA256 | Select-Object -ExpandProperty Hash)  $($msi.Name)",
            "$(Get-FileHash $setup.FullName -Algorithm SHA256 | Select-Object -ExpandProperty Hash)  $($setup.Name)"
          ) | Set-Content SHA256SUMS.txt

      - name: Publish GitHub alpha release as latest updater channel
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = $env:GITHUB_REF_NAME.Substring(1)
          $msi = Get-ChildItem 'src-tauri/target/release/bundle/msi/*.msi' | Select-Object -First 1
          $setup = Get-ChildItem 'src-tauri/target/release/bundle/nsis/*-setup.exe' | Select-Object -First 1
          $setupSignature = Get-Item "$($setup.FullName).sig"
          $msiSignature = Get-Item "$($msi.FullName).sig"
          $notesPath = "docs/releases/$version.md"
          $notesOption = @('--generate-notes')
          if (Test-Path -LiteralPath $notesPath) {
            $notesOption = @('--notes-file', $notesPath)
          }
          gh release create $env:GITHUB_REF_NAME `
            --repo $env:GITHUB_REPOSITORY `
            --title "AMP99 $version" `
            --latest `
            @notesOption `
            $msi.FullName `
            $setup.FullName `
            $msiSignature.FullName `
            $setupSignature.FullName `
            'SHA256SUMS.txt' `
            'latest.json'

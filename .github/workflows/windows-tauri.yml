name: Windows Tauri bundle

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-bundle:
    name: Build Windows installers
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm install

      - name: Build AMP99 MSI and NSIS installers
        run: npm run tauri:build -- --bundles msi,nsis

      - name: Show generated bundles
        shell: pwsh
        run: Get-ChildItem -Path src-tauri/target/release/bundle -Recurse | Select-Object FullName, Length

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: AMP99-windows-dev-bundle
          path: src-tauri/target/release/bundle/**/*
          if-no-files-found: error
          retention-days: 14

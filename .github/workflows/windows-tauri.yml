name: Windows Tauri bundle

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

env:
  CARGO_TERM_COLOR: always

jobs:
  windows-bundle:
    name: Build and smoke-test Windows installers
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Generate AMP99 platform icons
        shell: pwsh
        run: npm run tauri:icon

      - name: Build AMP99 MSI and NSIS installers
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          & npm.cmd run tauri -- build --bundles msi,nsis 2>&1 | Tee-Object -FilePath tauri-build.log
          $exitCode = $LASTEXITCODE
          if ($exitCode -ne 0) {
            exit $exitCode
          }

      - name: Smoke-test raw AMP99 executable and native windows
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $logPath = Join-Path $PWD "windows-smoke.log"
          function Write-SmokeLog([string]$message) {
            $line = "$(Get-Date -Format o) $message"
            $line | Tee-Object -FilePath $logPath -Append
          }

          Add-Type @"
          using System;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;
          using System.Text;

          public static class Amp99WindowProbe {
              private delegate bool EnumWindowsProc(IntPtr hWnd, IntPtr lParam);

              [DllImport("user32.dll")]
              private static extern bool EnumWindows(EnumWindowsProc callback, IntPtr lParam);

              [DllImport("user32.dll")]
              private static extern uint GetWindowThreadProcessId(IntPtr hWnd, out uint processId);

              [DllImport("user32.dll")]
              private static extern bool IsWindowVisible(IntPtr hWnd);

              [DllImport("user32.dll", CharSet = CharSet.Unicode)]
              private static extern int GetWindowText(IntPtr hWnd, StringBuilder text, int maxCount);

              [DllImport("user32.dll")]
              private static extern int GetWindowTextLength(IntPtr hWnd);

              public static string[] VisibleTitlesForProcess(int processId) {
                  var titles = new List<string>();
                  EnumWindows((hWnd, lParam) => {
                      uint pid;
                      GetWindowThreadProcessId(hWnd, out pid);
                      if (pid != processId || !IsWindowVisible(hWnd)) return true;

                      var length = GetWindowTextLength(hWnd);
                      var builder = new StringBuilder(length + 1);
                      GetWindowText(hWnd, builder, builder.Capacity);
                      var title = builder.ToString();
                      if (!String.IsNullOrWhiteSpace(title)) titles.Add(title);
                      return true;
                  }, IntPtr.Zero);
                  return titles.ToArray();
              }
          }
          "@

          function Wait-Amp99NativeWindows(
            [System.Diagnostics.Process]$process,
            [int]$timeoutSeconds = 30
          ) {
            $expected = @("AMP99 — Play it like it's 1999", "AMP99 Equalizer", "AMP99 Playlist Editor")
            $deadline = (Get-Date).AddSeconds($timeoutSeconds)
            $lastObserved = $null

            do {
              $process.Refresh()
              if ($process.HasExited) {
                Write-SmokeLog "FAIL raw executable exited early with code $($process.ExitCode)"
                throw "AMP99 raw executable exited during startup smoke test."
              }

              $titles = [Amp99WindowProbe]::VisibleTitlesForProcess($process.Id)
              $observed = $titles -join " | "
              if ($observed -ne $lastObserved) {
                Write-SmokeLog "Waiting for AMP99 native windows for PID $($process.Id): $observed"
                $lastObserved = $observed
              }

              $missing = @($expected | Where-Object { $titles -notcontains $_ })
              if ($missing.Count -eq 0) {
                Write-SmokeLog "PASS three independent native AMP99 windows exist in one process"
                return
              }

              Start-Sleep -Milliseconds 500
            } while ((Get-Date) -lt $deadline)

            Write-SmokeLog "FAIL native windows did not become ready within $timeoutSeconds seconds. Missing: $($missing -join ', '); found: $($titles -join ', ')"
            throw "AMP99 native windows did not become ready within $timeoutSeconds seconds."
          }

          $exePath = Join-Path $PWD "src-tauri/target/release/amp99.exe"
          if (-not (Test-Path $exePath)) {
            Write-SmokeLog "FAIL raw executable missing: $exePath"
            throw "Raw AMP99 executable was not produced."
          }

          Write-SmokeLog "Launching raw executable: $exePath"
          $process = Start-Process -FilePath $exePath -PassThru
          Wait-Amp99NativeWindows $process
          Write-SmokeLog "PASS raw executable stayed alive through native-window startup (PID $($process.Id))"
          Stop-Process -Id $process.Id -Force
          Start-Sleep -Seconds 1

      - name: Smoke-test MSI install, native windows, WSZ handoff, launch and uninstall
        if: success()
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $logPath = Join-Path $PWD "windows-smoke.log"
          function Write-SmokeLog([string]$message) {
            $line = "$(Get-Date -Format o) $message"
            $line | Tee-Object -FilePath $logPath -Append
          }

          Add-Type @"
          using System;
          using System.Collections.Generic;
          using System.Runtime.InteropServices;
          using System.Text;

          public static class Amp99InstalledWindowProbe {
              private delegate bool EnumWindowsProc(IntPtr hWnd, IntPtr lParam);
              [DllImport("user32.dll")] private static extern bool EnumWindows(EnumWindowsProc callback, IntPtr lParam);
              [DllImport("user32.dll")] private static extern uint GetWindowThreadProcessId(IntPtr hWnd, out uint processId);
              [DllImport("user32.dll")] private static extern bool IsWindowVisible(IntPtr hWnd);
              [DllImport("user32.dll")] private static extern bool IsIconic(IntPtr hWnd);
              [DllImport("user32.dll")] private static extern bool ShowWindow(IntPtr hWnd, int command);
              [DllImport("user32.dll")] private static extern bool SetForegroundWindow(IntPtr hWnd);
              [DllImport("user32.dll", CharSet = CharSet.Unicode)] private static extern int GetWindowText(IntPtr hWnd, StringBuilder text, int maxCount);
              [DllImport("user32.dll")] private static extern int GetWindowTextLength(IntPtr hWnd);
              public static string[] VisibleTitlesForProcess(int processId) {
                  var titles = new List<string>();
                  EnumWindows((hWnd, lParam) => {
                      uint pid;
                      GetWindowThreadProcessId(hWnd, out pid);
                      if (pid != processId || !IsWindowVisible(hWnd)) return true;
                      var length = GetWindowTextLength(hWnd);
                      var builder = new StringBuilder(length + 1);
                      GetWindowText(hWnd, builder, builder.Capacity);
                      var title = builder.ToString();
                      if (!String.IsNullOrWhiteSpace(title)) titles.Add(title);
                      return true;
                  }, IntPtr.Zero);
                  return titles.ToArray();
              }

              public static IntPtr WindowForProcess(int processId, string expectedTitle) {
                  IntPtr result = IntPtr.Zero;
                  EnumWindows((hWnd, lParam) => {
                      uint pid;
                      GetWindowThreadProcessId(hWnd, out pid);
                      if (pid != processId) return true;

                      var length = GetWindowTextLength(hWnd);
                      var builder = new StringBuilder(length + 1);
                      GetWindowText(hWnd, builder, builder.Capacity);
                      if (builder.ToString() == expectedTitle) {
                          result = hWnd;
                          return false;
                      }
                      return true;
                  }, IntPtr.Zero);
                  return result;
              }

              public static void Minimize(IntPtr hWnd) {
                  if (hWnd != IntPtr.Zero) ShowWindow(hWnd, 6);
              }

              public static void Restore(IntPtr hWnd) {
                  if (hWnd != IntPtr.Zero) ShowWindow(hWnd, 9);
              }

              public static bool IsRestored(IntPtr hWnd) {
                  return hWnd != IntPtr.Zero && IsWindowVisible(hWnd) && !IsIconic(hWnd);
              }

              public static void Focus(IntPtr hWnd) {
                  if (hWnd != IntPtr.Zero) SetForegroundWindow(hWnd);
              }
          }
          "@

          function Wait-Amp99InstalledWindows(
            [System.Diagnostics.Process]$process,
            [int]$timeoutSeconds = 30
          ) {
            $expected = @("AMP99 — Play it like it's 1999", "AMP99 Equalizer", "AMP99 Playlist Editor")
            $deadline = (Get-Date).AddSeconds($timeoutSeconds)
            $lastObserved = $null

            do {
              $process.Refresh()
              if ($process.HasExited) {
                Write-SmokeLog "FAIL installed executable exited early with code $($process.ExitCode)"
                throw "Installed AMP99 executable exited during startup smoke test."
              }

              $titles = [Amp99InstalledWindowProbe]::VisibleTitlesForProcess($process.Id)
              $observed = $titles -join " | "
              if ($observed -ne $lastObserved) {
                Write-SmokeLog "Waiting for installed AMP99 native windows: $observed"
                $lastObserved = $observed
              }

              $missing = @($expected | Where-Object { $titles -notcontains $_ })
              if ($missing.Count -eq 0) {
                Write-SmokeLog "PASS installed AMP99 exposes three native windows"
                return
              }

              Start-Sleep -Milliseconds 500
            } while ((Get-Date) -lt $deadline)

            Write-SmokeLog "FAIL installed native windows did not become ready within $timeoutSeconds seconds. Missing: $($missing -join ', '); found: $($titles -join ', ')"
            throw "Installed AMP99 native windows did not become ready within $timeoutSeconds seconds."
          }

          $msi = Get-ChildItem -Path "src-tauri/target/release/bundle/msi" -Filter "*.msi" -File | Select-Object -First 1
          if (-not $msi) {
            Write-SmokeLog "FAIL no MSI bundle was produced"
            throw "AMP99 MSI bundle was not produced."
          }

          $installDir = Join-Path $env:RUNNER_TEMP "AMP99-Smoke-Install"
          if (Test-Path $installDir) {
            Remove-Item -Path $installDir -Recurse -Force
          }

          Write-SmokeLog "Installing MSI $($msi.FullName) into $installDir"
          $installArgs = @(
            "/i",
            $msi.FullName,
            "/qn",
            "/norestart",
            "INSTALLDIR=$installDir"
          )
          $installer = Start-Process -FilePath "msiexec.exe" -ArgumentList $installArgs -PassThru -Wait
          if ($installer.ExitCode -ne 0) {
            Write-SmokeLog "FAIL MSI install exit code $($installer.ExitCode)"
            throw "AMP99 MSI silent install failed with exit code $($installer.ExitCode)."
          }

          $installedExe = Join-Path $installDir "amp99.exe"
          if (-not (Test-Path $installedExe)) {
            Write-SmokeLog "FAIL installed executable missing: $installedExe"
            throw "AMP99 executable was not found in the requested MSI install directory."
          }

          $wszAssociation = Get-Item -Path "Registry::HKEY_CLASSES_ROOT\.wsz" -ErrorAction SilentlyContinue
          if (-not $wszAssociation) {
            Write-SmokeLog "FAIL .wsz file association is missing from HKCR"
            throw "AMP99 MSI did not register the .wsz file association."
          }
          Write-SmokeLog "PASS .wsz file association is registered"

          Write-SmokeLog "Launching installed executable: $installedExe"
          $process = Start-Process -FilePath $installedExe -PassThru
          Wait-Amp99InstalledWindows $process

          $mainTitle = "AMP99 — Play it like it's 1999"
          $equalizerTitle = "AMP99 Equalizer"
          $playlistTitle = "AMP99 Playlist Editor"
          $mainHandle = [Amp99InstalledWindowProbe]::WindowForProcess($process.Id, $mainTitle)
          $equalizerHandle = [Amp99InstalledWindowProbe]::WindowForProcess($process.Id, $equalizerTitle)
          $playlistHandle = [Amp99InstalledWindowProbe]::WindowForProcess($process.Id, $playlistTitle)
          if ($mainHandle -eq [IntPtr]::Zero -or $equalizerHandle -eq [IntPtr]::Zero -or $playlistHandle -eq [IntPtr]::Zero) {
            throw "Could not identify all three AMP99 native windows for minimize/restore smoke test."
          }

          Write-SmokeLog "Testing native auxiliary restore after Main minimize"
          [Amp99InstalledWindowProbe]::Minimize($mainHandle)
          [Amp99InstalledWindowProbe]::Minimize($equalizerHandle)
          [Amp99InstalledWindowProbe]::Minimize($playlistHandle)
          Start-Sleep -Milliseconds 500
          [Amp99InstalledWindowProbe]::Restore($mainHandle)
          [Amp99InstalledWindowProbe]::Focus($mainHandle)

          $restoreDeadline = (Get-Date).AddSeconds(10)
          do {
            if ([Amp99InstalledWindowProbe]::IsRestored($mainHandle) -and
                [Amp99InstalledWindowProbe]::IsRestored($equalizerHandle) -and
                [Amp99InstalledWindowProbe]::IsRestored($playlistHandle)) {
              Write-SmokeLog "PASS Main minimize/restore returned Main, EQ and Playlist"
              break
            }
            Start-Sleep -Milliseconds 250
          } while ((Get-Date) -lt $restoreDeadline)

          if (-not ([Amp99InstalledWindowProbe]::IsRestored($mainHandle) -and
                    [Amp99InstalledWindowProbe]::IsRestored($equalizerHandle) -and
                    [Amp99InstalledWindowProbe]::IsRestored($playlistHandle))) {
            throw "Main minimize/restore did not return all visible auxiliary windows."
          }

          $testSkin = Join-Path $env:RUNNER_TEMP "amp99-single-instance-smoke.wsz"
          Set-Content -Path $testSkin -Value "AMP99 invalid test archive: native handoff only" -NoNewline
          Write-SmokeLog "Launching a secondary AMP99 instance with .wsz argument"
          $secondary = Start-Process -FilePath $installedExe -ArgumentList "`"$testSkin`"" -PassThru
          Start-Sleep -Seconds 4
          $secondary.Refresh()
          $process.Refresh()

          if (-not $secondary.HasExited) {
            Write-SmokeLog "FAIL secondary instance remained alive instead of handing off"
            Stop-Process -Id $secondary.Id -Force -ErrorAction SilentlyContinue
            throw "AMP99 single-instance .wsz handoff did not terminate the secondary process."
          }
          if ($process.HasExited) {
            Write-SmokeLog "FAIL primary instance exited during .wsz handoff"
            throw "AMP99 primary process exited during .wsz single-instance handoff."
          }
          Write-SmokeLog "PASS secondary .wsz launch handed off while primary stayed alive"

          Stop-Process -Id $process.Id -Force
          Start-Sleep -Seconds 1

          Write-SmokeLog "Uninstalling AMP99 MSI"
          $uninstallArgs = @(
            "/x",
            $msi.FullName,
            "/qn",
            "/norestart"
          )
          $uninstaller = Start-Process -FilePath "msiexec.exe" -ArgumentList $uninstallArgs -PassThru -Wait
          if ($uninstaller.ExitCode -ne 0) {
            Write-SmokeLog "FAIL MSI uninstall exit code $($uninstaller.ExitCode)"
            throw "AMP99 MSI silent uninstall failed with exit code $($uninstaller.ExitCode)."
          }

          Write-SmokeLog "PASS MSI install, three-window startup, WSZ association/handoff and uninstall smoke test"

      - name: Upload Windows smoke diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AMP99-windows-smoke-log
          path: windows-smoke.log
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Tauri build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: AMP99-tauri-build-log
          path: tauri-build.log
          if-no-files-found: warn
          retention-days: 14

      - name: Show generated bundles
        if: success()
        shell: pwsh
        run: Get-ChildItem -Path src-tauri/target/release/bundle -Recurse | Select-Object FullName, Length

      - name: Upload Windows bundle
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: AMP99-windows-dev-bundle
          path: src-tauri/target/release/bundle/**/*
          if-no-files-found: error
          retention-days: 14

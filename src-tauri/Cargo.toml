[package]
name = "amp99"
version = "0.1.0"
description = "AMP99 - Play it like it's '99"
authors = ["AMP99"]
edition = "2021"

[lib]
name = "amp99_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

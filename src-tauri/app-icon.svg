<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" role="img" aria-label="AMP99 app icon">
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b6068"/>
      <stop offset="0.16" stop-color="#353a42"/>
      <stop offset="0.55" stop-color="#1f232a"/>
      <stop offset="1" stop-color="#0f1116"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e2e5e8"/>
      <stop offset="0.18" stop-color="#7d838b"/>
      <stop offset="0.55" stop-color="#292e35"/>
      <stop offset="1" stop-color="#080a0d"/>
    </linearGradient>
    <linearGradient id="lcd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#102319"/>
      <stop offset="0.42" stop-color="#06110b"/>
      <stop offset="1" stop-color="#010403"/>
    </linearGradient>
    <radialGradient id="led" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#d5ff7e"/>
      <stop offset="0.35" stop-color="#7cff3e"/>
      <stop offset="1" stop-color="#187418"/>
    </radialGradient>
    <filter id="greenGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- transparent outside edge; original rounded hi-fi faceplate -->
  <rect x="72" y="58" width="880" height="908" rx="154" fill="#080a0d" opacity="0.55"/>
  <rect x="58" y="42" width="880" height="908" rx="154" fill="url(#metal)" stroke="url(#rim)" stroke-width="18"/>
  <rect x="82" y="68" width="832" height="856" rx="132" fill="none" stroke="#11151b" stroke-width="10"/>
  <path d="M105 142 Q122 91 182 83 H813 Q868 88 892 137" fill="none" stroke="#aeb3ba" stroke-width="6" opacity="0.55"/>

  <!-- recessed LCD -->
  <rect x="146" y="194" width="704" height="530" rx="68" fill="#050609" stroke="#05070a" stroke-width="28"/>
  <rect x="160" y="208" width="676" height="502" rx="55" fill="url(#lcd)" stroke="#686e73" stroke-width="8"/>
  <rect x="174" y="222" width="648" height="474" rx="44" fill="none" stroke="#101713" stroke-width="6"/>

  <!-- subtle LCD scanlines -->
  <g stroke="#183421" stroke-width="3" opacity="0.30">
    <path d="M188 260H808 M188 290H808 M188 320H808 M188 350H808 M188 380H808 M188 410H808 M188 440H808 M188 470H808 M188 500H808 M188 530H808 M188 560H808 M188 590H808 M188 620H808 M188 650H808"/>
  </g>

  <!-- A99 phosphor LCD monogram -->
  <g fill="#a7ff55" filter="url(#greenGlow)">
    <!-- A -->
    <rect x="252" y="322" width="38" height="270" rx="3"/>
    <rect x="392" y="322" width="38" height="270" rx="3"/>
    <rect x="290" y="292" width="102" height="38" rx="3"/>
    <rect x="290" y="426" width="102" height="38" rx="3"/>
    <rect x="268" y="306" width="38" height="38" rx="3"/>
    <rect x="376" y="306" width="38" height="38" rx="3"/>

    <!-- first 9 -->
    <rect x="486" y="292" width="116" height="38" rx="3"/>
    <rect x="462" y="322" width="38" height="116" rx="3"/>
    <rect x="588" y="322" width="38" height="270" rx="3"/>
    <rect x="486" y="426" width="102" height="38" rx="3"/>
    <rect x="486" y="554" width="102" height="38" rx="3"/>

    <!-- second 9 -->
    <rect x="672" y="292" width="116" height="38" rx="3"/>
    <rect x="648" y="322" width="38" height="116" rx="3"/>
    <rect x="774" y="322" width="38" height="270" rx="3"/>
    <rect x="672" y="426" width="102" height="38" rx="3"/>
    <rect x="672" y="554" width="102" height="38" rx="3"/>
  </g>

  <!-- LCD baseline and play indicator -->
  <rect x="254" y="628" width="390" height="8" rx="4" fill="#245732" opacity="0.55"/>
  <path d="M738 610 L738 666 L790 638 Z" fill="#9cff4d" stroke="#caff87" stroke-width="3" filter="url(#greenGlow)"/>

  <!-- lower faceplate details -->
  <g fill="#07090c" stroke="#555a61" stroke-width="2">
    <rect x="178" y="792" width="92" height="18" rx="9"/>
    <rect x="178" y="821" width="92" height="18" rx="9"/>
  </g>
  <g fill="#6f747b" opacity="0.95">
    <rect x="386" y="790" width="18" height="58" rx="5"/>
    <rect x="414" y="790" width="18" height="58" rx="5"/>
    <rect x="442" y="790" width="18" height="58" rx="5"/>
    <rect x="483" y="790" width="18" height="58" rx="5"/>
    <rect x="511" y="790" width="18" height="58" rx="5"/>
    <rect x="539" y="790" width="18" height="58" rx="5"/>
    <rect x="580" y="790" width="18" height="58" rx="5"/>
    <rect x="608" y="790" width="18" height="58" rx="5"/>
  </g>
  <text x="506" y="887" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="36" letter-spacing="12" fill="#7c8188" stroke="#080a0d" stroke-width="2">AMP99</text>

  <!-- status LED -->
  <circle cx="794" cy="822" r="30" fill="#070a08" stroke="#494e50" stroke-width="7"/>
  <circle cx="794" cy="822" r="17" fill="url(#led)"/>
  <circle cx="789" cy="816" r="5" fill="#efffc7" opacity="0.9"/>
</svg>
